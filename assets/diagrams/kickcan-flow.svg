<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img"><title>KICK-CAN · 조작이 차량에 전달되는 과정</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#55799f" stroke-width="1.5"/></marker></defs><rect width="600" height="190" rx="8" fill="#f7f9fc"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="18" y="26" font-size="13" font-weight="700" fill="#315b89">KICK-CAN · 조작이 차량에 전달되는 과정</text><rect x="18" y="54" width="174" height="84" rx="5" fill="#e9f1fc" stroke="#527aa6"/><text x="30" y="73" font-size="10" fill="#315b89">담당</text><text x="30" y="97" font-size="17" font-weight="700" fill="#17243a">무선 조종기</text><text x="30" y="121" font-size="11" fill="#607087">카드 인증 · 입력 · 명령 전송</text><path d="M194 101H209" stroke="#55799f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="199" y="48" text-anchor="middle" font-size="10" fill="#607087">Bluetooth</text><rect x="213" y="54" width="174" height="84" rx="5" fill="#fff" stroke="#dbe3ed"/><text x="225" y="97" font-size="17" font-weight="700" fill="#17243a">차량 주행 제어</text><text x="225" y="121" font-size="11" fill="#607087">무선 명령 수신 · 차량 구동</text><path d="M389 101H404" stroke="#55799f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="394" y="48" text-anchor="middle" font-size="10" fill="#607087">CAN</text><rect x="408" y="54" width="174" height="84" rx="5" fill="#fff" stroke="#dbe3ed"/><text x="420" y="97" font-size="17" font-weight="700" fill="#17243a">센서·상태 표시</text><text x="420" y="121" font-size="11" fill="#607087">차량 주변 감지 · 출력 표시</text><text x="18" y="169" font-size="11" fill="#607087">담당 범위는 조종기 하드웨어·펌웨어이며, 차량 내부 노드는 팀 구현</text></g></svg>
