<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="32" y="43" font-size="24" font-weight="700" fill="#0f172a">Frame Buffer · 최신 프레임 우선 처리</text><text x="32" y="72" font-size="14" fill="#64748b">처리량 차이를 버퍼 크기만으로 해결하지 않고, 현재 자세를 빠르게 반영하도록 소비 정책 변경</text><rect x="35" y="112" width="240" height="135" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="53" y="142" font-size="18" font-weight="700" fill="#2563eb">Camera Writer</text><text x="53" y="169" font-size="14" fill="#334155">빈 슬롯 확보 → 프레임 기록</text><text x="53" y="192" font-size="14" fill="#334155">기록 완료 슬롯 게시</text><text x="53" y="215" font-size="14" fill="#334155">빈 슬롯이 없으면 새 입력 drop</text><rect x="335" y="112" width="365" height="135" rx="12" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="353" y="142" font-size="18" font-weight="700" fill="#7c3aed">Pose Reader</text><text x="353" y="169" font-size="14" fill="#334155">대기 슬롯 확보 → 최신 슬롯 선택</text><text x="353" y="192" font-size="14" fill="#334155">프로세스 로컬 메모리로 copy</text><text x="353" y="215" font-size="14" fill="#334155">복사가 끝난 뒤 슬롯 반환</text><rect x="760" y="112" width="305" height="135" rx="12" fill="white" stroke="#059669" stroke-width="2"/><text x="778" y="142" font-size="18" font-weight="700" fill="#059669">Pose Inference</text><text x="778" y="169" font-size="14" fill="#334155">로컬 복사본으로 추론</text><text x="778" y="192" font-size="14" fill="#334155">오래된 프레임은 skip</text><text x="778" y="215" font-size="14" fill="#334155">공유 슬롯 재사용과 추론 분리</text><path d="M275 177 H335" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 177 H760" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="294" font-size="13" fill="#64748b">Overrun = 입력 시 빈 슬롯 없음   /   Skip = 쌓인 프레임 중 과거 프레임을 의도적으로 건너뜀</text><text x="35" y="325" font-size="13" fill="#64748b">슬롯 반환 이후 공유 배열을 그대로 읽지 않도록 복사 시점을 배치 · 누적 Overrun 수와 현재 대기량은 별도 관찰</text></g></svg>