<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="32" y="43" font-size="24" font-weight="700" fill="#0f172a">POCO · Runtime Structure</text><text x="32" y="72" font-size="14" fill="#64748b">현재 POSE_ONLY 실행 기준 · 영상 / 상태 / 이벤트의 전달 방식 분리</text><rect x="35" y="115" width="265" height="125" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="53" y="145" font-size="18" font-weight="700" fill="#2563eb">Main Process · PyQt</text><text x="53" y="172" font-size="14" fill="#334155">카메라 QThread / 화면 표시</text><text x="53" y="195" font-size="14" fill="#334155">프로필·보정·측정 명령</text><text x="53" y="218" font-size="14" fill="#334155">결과 수신 및 CSV 기록</text><rect x="390" y="115" width="275" height="125" rx="12" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="408" y="145" font-size="18" font-weight="700" fill="#7c3aed">Pose Process</text><text x="408" y="172" font-size="14" fill="#334155">Shared Memory → 최신 프레임</text><text x="408" y="195" font-size="14" fill="#334155">MediaPipe → 특징 → GRU</text><text x="408" y="218" font-size="14" fill="#334155">자세 상태 및 신뢰도 전달</text><rect x="755" y="115" width="310" height="125" rx="12" fill="white" stroke="#059669" stroke-width="2"/><text x="773" y="145" font-size="18" font-weight="700" fill="#059669">Hardware Process</text><text x="773" y="172" font-size="14" fill="#334155">ToF·IMU 입력 / 모터·부저</text><text x="773" y="195" font-size="14" fill="#334155">IMU PID → Motor 3·4</text><text x="773" y="218" font-size="14" fill="#334155">I2C·Serial을 한 프로세스에서 관리</text><path d="M300 145 H390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="306" y="128" font-size="13" fill="#64748b">Frame Ring</text><path d="M390 210 H300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="313" y="232" font-size="13" fill="#64748b">분석 결과</text><path d="M665 166 H755" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="151" font-size="13" fill="#64748b">자세 상태</text><path d="M165 240 V286 H909 V240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="362" y="279" font-size="13" fill="#64748b">State: 최신값  /  Command·Event: 순서 유지</text><rect x="35" y="348" width="265" height="110" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="53" y="378" font-size="18" font-weight="700" fill="#2563eb">CSV / JSON</text><text x="53" y="405" font-size="14" fill="#334155">날짜별 측정 로그</text><text x="53" y="428" font-size="14" fill="#334155">사용자별 기준값·설정</text><rect x="390" y="348" width="275" height="110" rx="12" fill="white" stroke="#e11d48" stroke-width="2"/><text x="408" y="378" font-size="18" font-weight="700" fill="#e11d48">Streamlit · Plotly</text><text x="408" y="405" font-size="14" fill="#334155">자세별 시간·분포</text><text x="408" y="428" font-size="14" fill="#334155">문제 유형별 피드백·시간대 추이</text><path d="M165 240 V348" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 398 H390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="755" y="348" width="310" height="110" rx="12" fill="white" stroke="#059669" stroke-width="2"/><text x="773" y="378" font-size="18" font-weight="700" fill="#059669">하드웨어 제어 원칙</text><text x="773" y="405" font-size="14" fill="#334155">정상 자세에서 위치 추종</text><text x="773" y="428" font-size="14" fill="#334155">비정상 자세·센서 상태에 따라 제한</text><path d="M909 240 V348" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="513" font-size="13" fill="#64748b">공유 메모리: 영상 전달  |  Queue: 프로세스 간 통신  |  RLock + 복사본: 메인 프로세스 내부 상태 보호</text><text x="35" y="543" font-size="13" fill="#64748b">Face 프로세스는 현재 비활성화 · 저장소의 실행 